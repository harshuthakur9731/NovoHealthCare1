<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>
        NoveHealthcare Admin Dashboard
    </title>


    <link rel="stylesheet" href="admin.css">


</head>


<body>



    <header class="admin-header">


        <h1>
            NoveHealthcare Dashboard
        </h1>


        <button onclick="logout()">
            Logout
        </button>


    </header>





    <div class="dashboard">


        <section class="panel">


            <h2>
                Add New Product
            </h2>


            <input id="productName" placeholder="Product Name">


            <input id="category" placeholder="Category">


            <input id="description" placeholder="Description">

            <input id="productImage" type="file" placeholder="Image URL">

            <button onclick="addProduct()">

                Add Product

            </button>



        </section>





        <section class="panel">


            <h2>
                Product List
            </h2>


            <table>


                <thead>

                    <tr>

                        <th>
                            Product
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Action
                        </th>


                    </tr>


                </thead>



                <tbody id="productTable">


                </tbody>



            </table>



        </section>





        <section class="panel">


            <h2>
                Customer Enquiries
            </h2>


            <div class="enquiry">


                <p>
                    No enquiries available.
                </p>


            </div>



        </section>



    </div>




    <script src="admin.js"></script>


</body>


</html>
