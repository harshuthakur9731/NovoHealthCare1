<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NoveHealthcare Admin Login</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="login-box">


<img src="../assets/logo.svg" class="admin-logo">


<h2>
Admin Login
</h2>


<input 
type="text"
id="username"
placeholder="Username">


<input
type="password"
id="password"
placeholder="Password">


<button onclick="login()">

Login

</button>


<p id="message"></p>


</div>



<script src="admin.js"></script>


</body>

</html>
